# Publica o hub em andreaeboli.com (cPanel/LiteSpeed na nuvemHospedagem).
#
# CONVIVE com o deploy.yml do GitHub Pages de propósito: enquanto a migração
# não estiver concluída, o site do Pages continua no ar. Por isso aqui não há
# `on: push` nem `schedule` — só disparo manual. O cron entra no fim, junto
# com a retirada do workflow do Pages.
#
# ⚠️ CONTEXTO DE SEGURANÇA DESTA CONTA cPANEL (medido em 02/09/2026):
#   1. public_html tem TRÊS sites dentro, confirmado na tela Domínios do
#      cPanel em 02/09/2026:
#        andreaeboli.com            → /public_html          (o hub vai aqui)
#        edroficinadesolucoes.com   → /public_html/edroficinadesolucoes.com
#        form.andreaeboli.com       → /public_html/form.andreaeboli.com
#      Os dois últimos estão NO AR e são de terceiros/outros projetos. Uma
#      sincronização com exclusão em public_html apagaria os dois. É por isso
#      que a lista `exclude` do passo de envio não é opcional.
#   2. O e-mail de andreaeboli.com está nesta mesma hospedagem (o MX aponta
#      para o próprio domínio) e o Maildir mora dentro de /home/andreaeb.
#   Por isso a conta de FTP tem de ser ESCOPADA em public_html: é a defesa que
#   não depende de eu escrever o caminho certo. Com o usuário mestre
#   `andreaeb` o FTP abre em /home/andreaeb, e um erro alcança o e-mail e o
#   outro site.
#
# ─────────────────────────────────────────────────────────────────────────
# POR QUE O DEPLOY É EM PASSOS
#
# O destino tem um WordPress no ar. Quem decide o que responde na raiz não é a
# quantidade de arquivos: é o `.htaccess` (as regras do WP mandam tudo para
# index.php) e o DirectoryIndex. Ou seja, **subir os arquivos do hub não troca
# o site** — quem troca é o `.htaccess`.
#
# Isso é uma vantagem, e o desenho abaixo a explora: o corte passa a ser a
# publicação de DOIS arquivos, e voltar atrás também. Não é preciso apagar
# nada em massa para descobrir se funcionou.
#
#   1. simulacao        → não escreve nada. Lista o que subiria e a árvore do
#                         servidor, para achar o outro site da conta.
#   2. enviar-arquivos  → sobe o hub inteiro MENOS o .htaccess e a raiz.
#                         O WordPress continua servindo o site; o visitante
#                         não vê diferença nenhuma.
#   3. ativar           → publica só o .htaccess e o index.html da raiz.
#                         O hub assume na hora, e o passo guarda o .htaccess
#                         do WordPress no servidor antes de sobrescrever.
#   4. reverter         → devolve o .htaccess do WordPress. Segundos.
#
# A remoção dos arquivos do WordPress fica para DEPOIS de o hub estar
# confirmado no ar, é feita à parte e não por este workflow.
# ─────────────────────────────────────────────────────────────────────────

name: Deploy (andreaeboli.com)

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Passo do deploy (ver o cabeçalho do arquivo)"
        required: true
        default: diagnostico
        type: choice
        options:
          - diagnostico
          - simulacao
          - enviar-arquivos
          - ativar
          - reverter

concurrency:
  # ⚠️ SEM cancel-in-progress. Upload por FTP não é atômico: cancelar no meio
  # deixa o site com HTML novo pedindo chunk que não subiu.
  group: deploy-andreaeboli
  cancel-in-progress: false

env:
  SITE_URL: https://andreaeboli.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: inputs.modo != 'reverter' && inputs.modo != 'diagnostico'
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        if: inputs.modo != 'reverter' && inputs.modo != 'diagnostico'
        run: npm ci

      # Hospedagem estática não tem servidor: saem as rotas de API, o Studio
      # embutido e o middleware de idioma.
      - name: Remover partes server-only
        if: inputs.modo != 'reverter' && inputs.modo != 'diagnostico'
        run: rm -rf src/app/api 'src/app/(studio)' src/proxy.ts

      - name: Build estático
        if: inputs.modo != 'reverter' && inputs.modo != 'diagnostico'
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          # NÃO definir NEXT_PUBLIC_BASE_PATH: o padrão do next.config.ts é
          # vazio, que é o correto para um site na raiz do domínio.
          NEXT_PUBLIC_SANITY_PROJECT_ID: 52ssivbg
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2024-10-01"

      - name: Montar o .htaccess e a raiz
        if: inputs.modo != 'reverter' && inputs.modo != 'diagnostico'
        run: |
          mkdir -p ativacao
          cp deploy/htaccess ativacao/.htaccess

          # A raiz redireciona para /pt/ pela regra de servidor no .htaccess.
          # Este index.html é rede de proteção: se o .htaccess não valer, sem
          # ele a raiz cai em listagem de diretório.
          cat > ativacao/index.html <<EOF
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=./pt/" />
              <link rel="canonical" href="${{ env.SITE_URL }}/pt/" />
              <title>Andrea Eboli</title>
            </head>
            <body>
              <p><a href="./pt/">Continuar para o site</a></p>
            </body>
          </html>
          EOF

          # Os dois arquivos que fazem a troca saem do envio em massa: sobem
          # no modo `ativar`, deliberadamente.
          rm -f out/.htaccess out/index.html

      - name: Conferir o artefato
        if: inputs.modo != 'reverter' && inputs.modo != 'diagnostico'
        run: |
          echo "arquivos: $(find out -type f | wc -l)  ·  tamanho: $(du -sh out | cut -f1)"
          test -f out/404.html || { echo "ERRO: 404.html ausente"; exit 1; }
          test -f ativacao/.htaccess || { echo "ERRO: .htaccess ausente"; exit 1; }
          # O basePath antigo não pode ter sobrado: era a falha que subia meio
          # site prefixado com o build passando verde.
          if grep -rlq "hub-andrea-eboli" out; then
            echo "ERRO: ainda há referência a /hub-andrea-eboli:"
            grep -rl "hub-andrea-eboli" out | head -5
            exit 1
          fi
          grep -q "${{ env.SITE_URL }}/pt/sobre/" out/pt/sobre/index.html \
            || { echo "ERRO: canonical não aponta para ${{ env.SITE_URL }}"; exit 1; }
          echo "artefato conferido"

      # ------------------------------------------------------------------
      # 0. DIAGNÓSTICO — não escreve nada. Só descobre onde a conta está
      #    enraizada e se o TLS funciona.
      # ------------------------------------------------------------------
      # Existe porque a primeira simulação autenticou ("230 OK. Current
      # restricted directory is /") mas a listagem voltou vazia, e a action
      # registrou "Connected (No encryption)". Sem saber em QUE diretório a
      # conta está, enviar arquivo é chute.
      #
      # ⚠️ Sem `curl -v` de propósito: o modo verboso do curl imprime o
      # comando PASS com a senha em claro no log do Actions.
      - name: Diagnóstico do FTP
        if: inputs.modo == 'diagnostico'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # ⚠️ `set +e` OBRIGATÓRIO. O shell do Actions roda com `bash -e`, e a
          # primeira sonda que falha mataria o passo — foi o que aconteceu na
          # execução anterior, que morreu no primeiro curl e não reportou nada.
          # Aqui a falha de uma sonda É o resultado, não um erro.
          set +e
          U="$FTP_USER:$FTP_PASSWORD"

          # Dois hostnames. O certificado que a porta 21 apresenta é emitido
          # SÓ para alvorada.nuvemidc.com (CN e único SAN, conferido de fora),
          # então conectar como ftp.andreaeboli.com dá incompatibilidade de
          # nome e o curl recusa, com razão. Testar os dois de uma vez evita
          # uma ida e volta.
          for H in "$FTP_HOST" alvorada.nuvemidc.com; do
            echo "==================================================="
            echo "  HOST: $H"
            echo "==================================================="

            echo "--- TLS ---"
            curl --ssl-reqd -s --max-time 60 --user "$U" "ftp://$H/" -o lista-tls.txt
            echo "  exit com --ssl-reqd (0 = TLS ok e certificado válido): $?"
            curl -s --max-time 60 --user "$U" "ftp://$H/" -o lista-plana.txt
            echo "  exit sem TLS:                                         $?"

            LISTA=""
            [ -s lista-tls.txt ] && LISTA=$(cat lista-tls.txt)
            [ -z "$LISTA" ] && [ -s lista-plana.txt ] && LISTA=$(cat lista-plana.txt)

            if [ -z "$LISTA" ]; then
              echo "  (nenhuma listagem, pulando as demais sondas deste host)"
              continue
            fi

            echo
            echo "--- conteúdo da raiz da conta ---"
            echo "$LISTA"

            echo
            echo "--- onde a conta está enraizada ---"
            # Se estes arquivos existem na raiz da conta, ela está em
            # public_html, o document root do andreaeboli.com.
            for alvo in .htaccess wp-config.php wp-login.php index.php; do
              curl -sf --max-time 45 --user "$U" "ftp://$H/$alvo" -o baixado 2>/dev/null
              if [ $? -eq 0 ]; then
                echo "  EXISTE   $alvo  ($(wc -c < baixado) bytes)"
              else
                echo "  ausente  $alvo"
              fi
            done

            echo
            echo "--- primeiras linhas do .htaccess (identifica o WordPress) ---"
            curl -sf --max-time 45 --user "$U" "ftp://$H/.htaccess" -o ht 2>/dev/null
            if [ $? -eq 0 ]; then
              head -5 ht | sed 's/^/    /'
            else
              echo "    (não foi possível baixar)"
            fi

            echo
            echo "--- pastas dos outros dois sites da conta ---"
            for d in edroficinadesolucoes.com form.andreaeboli.com; do
              curl -sf --max-time 45 --user "$U" "ftp://$H/$d/" -o dir.txt 2>/dev/null
              if [ $? -eq 0 ]; then
                echo "  EXISTE   $d  ($(wc -l < dir.txt) entradas)"
              else
                echo "  ausente  $d"
              fi
            done
            echo
          done
          exit 0

      # ------------------------------------------------------------------
      # 1. SIMULAÇÃO — não escreve nada no servidor
      # ------------------------------------------------------------------
      - name: Simulação do envio
        if: inputs.modo == 'simulacao'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ./
          dry-run: true
          state-name: .deploy-sync-state.json
          timeout: 120000
          log-level: verbose

      - name: Listar a árvore do servidor
        if: inputs.modo == 'simulacao'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "=== conteúdo da raiz da conta de FTP (tem de ser public_html) ==="
          LISTA=$(curl --ssl-reqd -s --max-time 90 --user "$FTP_USER:$FTP_PASSWORD" "ftp://$FTP_HOST/" || true)
          echo "$LISTA"

          # Guarda de sanidade. A conta TEM de estar escopada em public_html, e
          # as pastas dos outros dois sites da conta têm de aparecer aqui. Se
          # não aparecerem, ou a conta aponta para outro diretório (e o deploy
          # iria para o lugar errado) ou algo mudou de lugar no servidor. Nos
          # dois casos é para parar e reavaliar, não seguir para o envio.
          echo
          echo "=== conferência do diretório ==="
          for esperado in wp-config.php edroficinadesolucoes.com form.andreaeboli.com; do
            if echo "$LISTA" | grep -q "$esperado"; then
              echo "  ok       encontrado: $esperado"
            else
              echo "  ATENÇÃO  NÃO encontrado: $esperado"
            fi
          done

      # ------------------------------------------------------------------
      # 2. ENVIAR ARQUIVOS — o WordPress continua servindo o site
      # ------------------------------------------------------------------
      - name: Enviar o hub, sem trocar o site
        if: inputs.modo == 'enviar-arquivos'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          # ⚠️ `ftps`, não `ftp`: o padrão da action manda a senha do cPanel
          # em texto claro na rede a cada deploy.
          protocol: ftps
          local-dir: ./out/
          # A conta é escopada em public_html, então "./" já é o destino.
          server-dir: ./
          dry-run: false
          state-name: .deploy-sync-state.json
          timeout: 120000
          log-level: standard
          # ⚠️ NÃO REDUZIR ESTA LISTA. As duas primeiras entradas são os
          # document roots dos OUTROS DOIS SITES no ar dentro de public_html
          # (ver o cabeçalho do arquivo). Sem elas, o deploy os apaga.
          # As linhas wp-* preservam o WordPress de andreaeboli.com até o
          # corte estar confirmado, para o modo `reverter` ter para onde
          # voltar.
          exclude: |
            edroficinadesolucoes.com/**
            form.andreaeboli.com/**
            cgi-bin/**
            .well-known/**
            **/.git*
            **/.git*/**
            **/node_modules/**
            wp-admin/**
            wp-includes/**
            wp-content/**
            wp-*.php
            xmlrpc.php
            index.php
            .htaccess

      # ------------------------------------------------------------------
      # 3. ATIVAR — a troca, dois arquivos
      # ------------------------------------------------------------------
      - name: Guardar o .htaccess do WordPress e ativar o hub
        if: inputs.modo == 'ativar'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          U="$FTP_USER:$FTP_PASSWORD"

          # Guarda o .htaccess atual como .htaccess.wordpress no próprio
          # servidor, que é o que o modo `reverter` usa para devolver o site.
          if curl --ssl-reqd -sf --max-time 90 --user "$U" \
               "ftp://$FTP_HOST/.htaccess" -o htaccess-wordpress-atual; then
            echo "→ .htaccess do WordPress lido ($(wc -c < htaccess-wordpress-atual) bytes)"
            curl --ssl-reqd -sf --max-time 90 --user "$U" \
              -T htaccess-wordpress-atual "ftp://$FTP_HOST/.htaccess.wordpress"
            echo "→ cópia de segurança gravada no servidor: .htaccess.wordpress"
          else
            echo "→ não havia .htaccess no servidor; seguindo"
          fi

          # A TROCA. Daqui em diante a raiz é o hub.
          curl --ssl-reqd -sf --max-time 90 --user "$U" \
            -T ativacao/index.html "ftp://$FTP_HOST/index.html"
          curl --ssl-reqd -sf --max-time 90 --user "$U" \
            -T ativacao/.htaccess "ftp://$FTP_HOST/.htaccess"
          echo "→ hub ATIVO em ${{ env.SITE_URL }}"

      - name: Conferir o site no ar
        if: inputs.modo == 'ativar'
        run: |
          sleep 15
          for u in "/pt/" "/pt/pesquisa/" "/pt/confraria/" "/en/" "/es/" "/uma-url-que-nao-existe/"; do
            printf "  %-28s HTTP %s\n" "$u" \
              "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${{ env.SITE_URL }}$u")"
          done
          printf "  %-28s HTTP %s -> %s\n" "/ (raiz)" \
            "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${{ env.SITE_URL }}/")" \
            "$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 30 "${{ env.SITE_URL }}/")"
          echo "  título servido na raiz:"
          curl -sL --max-time 30 "${{ env.SITE_URL }}/" | grep -oiE "<title>[^<]{0,70}" | head -1

      # ------------------------------------------------------------------
      # 4. REVERTER — devolve o WordPress em segundos
      # ------------------------------------------------------------------
      - name: Reverter para o WordPress
        if: inputs.modo == 'reverter'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          U="$FTP_USER:$FTP_PASSWORD"
          curl --ssl-reqd -sf --max-time 90 --user "$U" \
            "ftp://$FTP_HOST/.htaccess.wordpress" -o htaccess-wordpress
          test -s htaccess-wordpress || { echo "ERRO: cópia de segurança ausente ou vazia"; exit 1; }
          curl --ssl-reqd -sf --max-time 90 --user "$U" \
            -T htaccess-wordpress "ftp://$FTP_HOST/.htaccess"
          # Sai o index.html do hub para o index.php do WordPress voltar a
          # responder na raiz.
          curl --ssl-reqd -s --max-time 90 --user "$U" \
            -Q "-DELE /index.html" "ftp://$FTP_HOST/" || true
          echo "→ WordPress devolvido. Título servido na raiz:"
          sleep 15
          curl -sL --max-time 30 "${{ env.SITE_URL }}" | grep -oiE "<title>[^<]{0,70}" | head -1
